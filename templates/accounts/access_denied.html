{% extends 'base.html' %}

{% block title %}CareerConnect | Access Denied{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container py-lg-3">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card border-0 shadow-sm cc-auth-card text-center">
                    <div class="card-body p-4 p-md-5">
                        <div class="cc-auth-icon d-inline-flex align-items-center justify-content-center mb-3 text-danger bg-danger-subtle">
                            <i class="bi bi-shield-lock-fill"></i>
                        </div>
                        <h1 class="h3 fw-bold mb-2">Access Restricted</h1>
                        <p class="text-muted mb-4">
                            This page is restricted to <strong>{{ required_role|default:"authorized" }}</strong> accounts.
                            You do not have permission to view this dashboard.
                        </p>
                        <div class="d-flex justify-content-center gap-2">
                            <a href="{% url dashboard_url_name %}" class="btn btn-primary cc-btn-primary px-4">
                                Go to My Dashboard
                            </a>
                            <a href="{% url 'home' %}" class="btn btn-outline-secondary px-4">
                                Home
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
